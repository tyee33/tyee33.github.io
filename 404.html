<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面走丢了 · tyee33</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #050506; --fg: #f2f2f5; --fg-2: #a4a4ae; --line: rgb(255 255 255 / .10);
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f3f5; --fg: #0b0b0d; --fg-2: #4c4c55; --line: rgb(0 0 0 / .12); }
  }
  * { box-sizing: border-box; }
  body {
    display: grid;
    place-items: center;
    min-height: 100svh;
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    text-align: center;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  .box {
    max-width: 460px;
    padding: 44px 36px;
    border: 1px solid var(--line);
    border-radius: 26px;
    background: color-mix(in oklab, var(--bg) 82%, transparent);
    backdrop-filter: blur(18px);
  }
  .code {
    font-family: var(--font-mono);
    font-size: .74rem;
    letter-spacing: .22em;
    color: var(--fg-2);
  }
  h1 { margin: 18px 0 10px; font-size: clamp(1.6rem, 6vw, 2.2rem); letter-spacing: -.03em; }
  p { margin: 0 0 26px; color: var(--fg-2); line-height: 1.7; }
  a {
    display: inline-block;
    padding: .72em 1.4em;
    border-radius: 999px;
    background: var(--fg);
    color: var(--bg);
    text-decoration: none;
    font-size: .92rem;
  }
</style>
</head>
<body>
  <div class="box">
    <p class="code">ERROR 404</p>
    <h1>这个页面不存在</h1>
    <p>链接可能写错了，或者页面被移动过。</p>
    <a href="/">回到首页</a>
  </div>
</body>
</html>
